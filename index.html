<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="TOKO KITA: belanja sayur, buah, dan kebutuhan harian dengan mudah dari HP.">
  <meta name="theme-color" content="#0F7B4A">
  <title>TOKO KITA</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- CSS eksternal -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="bar">
      <a class="brand" href="./" aria-label="TOKO KITA, beranda">
        <span class="logo">TK</span>
        <b>TOKO KITA</b>
      </a>

      <button class="cartbtn" id="openCart" type="button" aria-label="Buka keranjang belanja">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="20" r="1.5"/>
          <circle cx="18" cy="20" r="1.5"/>
          <path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/>
        </svg>
        <span class="badge" id="badge" hidden>0</span>
      </button>
    </div>

    <!-- Pencarian -->
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-3.5-3.5"/>
      </svg>
      <input id="q" type="search" placeholder="Cari produk di TOKO KITA" aria-label="Cari produk" autocomplete="off">
    </label>
  </header>

  <main>
    <!-- ===== BANNER PROMO ===== -->
    <section class="banner" aria-label="Promosi">
      <span class="tag">-30%</span>
      <h2>Belanja Segar, Hemat Hari Ini</h2>
      <p>Diskon sayur &amp; buah pilihan. Gratis ongkir min. Rp100.000.</p>
      <button class="cta" id="promo" type="button">Lihat promo</button>
      <span class="art" aria-hidden="true">🥬</span>
    </section>

    <!-- ===== KATEGORI ===== -->
    <div class="sec"><h3>Kategori</h3></div>
    <nav class="cats" id="cats" aria-label="Kategori produk">
      <button class="cat" type="button" data-c="all"   aria-pressed="true"><i>🛍️</i>Semua</button>
      <button class="cat" type="button" data-c="sayur" aria-pressed="false"><i>🥦</i>Sayur</button>
      <button class="cat" type="button" data-c="buah"  aria-pressed="false"><i>🍎</i>Buah</button>
      <button class="cat" type="button" data-c="dapur" aria-pressed="false"><i>🍚</i>Dapur</button>
      <button class="cat" type="button" data-c="minum" aria-pressed="false"><i>🥛</i>Minuman</button>
      <button class="cat" type="button" data-c="rumah" aria-pressed="false"><i>🧺</i>Rumah</button>
    </nav>

    <!-- ===== DAFTAR PRODUK ===== -->
    <div class="sec">
      <h3 id="gt">Produk Pilihan</h3>
      <span id="cnt" aria-live="polite"></span>
    </div>

    <!-- Kartu produk diisi oleh js/app.js -->
    <div class="grid" id="grid">
      <noscript><p class="empty">Aktifkan JavaScript untuk melihat produk.</p></noscript>
    </div>
  </main>

  <!-- ===== KERANJANG ===== -->
  <div class="scrim" id="scrim"></div>

  <aside class="sheet" id="sheet" aria-label="Keranjang belanja" aria-hidden="true">
    <div class="sh-h">
      <h3>Keranjang</h3>
      <button class="x" id="close" type="button" aria-label="Tutup keranjang">✕</button>
    </div>

    <!-- Isi keranjang diisi oleh js/app.js -->
    <div class="items" id="items"></div>

    <div class="foot">
      <div class="tot"><span>Total</span><b id="total">Rp0</b></div>
      <button class="pay" id="pay" type="button" disabled>Checkout</button>
    </div>
  </aside>

  <!-- Notifikasi singkat -->
  <div class="toast" id="toast" role="status"></div>

  <!-- JavaScript eksternal -->
  <script src="js/app.js"></script>
</body>
</html>
